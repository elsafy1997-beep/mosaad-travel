<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم مُساعد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .sidebar{background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .logo{margin-bottom:26px}
  .sidebar nav a{display:block;padding:11px 14px;border-radius:10px;color:#cbd5e1;margin-bottom:4px;font-size:.92rem;transition:.2s}
  .sidebar nav a:hover,.sidebar nav a.active{background:rgba(201,162,39,.15);color:var(--gold)}
  .main{padding:26px 30px;background:var(--light);min-height:100vh}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px}
  .top h1{font-size:1.6rem}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px}
  .stat{background:#fff;padding:20px;border-radius:14px;box-shadow:var(--shadow);border-right:4px solid var(--gold)}
  .stat .label{font-size:.85rem;color:var(--gray)}
  .stat .value{font-size:1.6rem;font-weight:900;color:var(--navy);margin-top:4px}
  table{width:100%;background:#fff;border-radius:12px;box-shadow:var(--shadow);border-collapse:collapse;overflow:hidden;font-size:.9rem}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--border)}
  th{background:#f8fafc;font-weight:700;font-size:.85rem}
  tr:hover td{background:#f8fafc}
  .pill{padding:3px 10px;border-radius:50px;font-size:.78rem;font-weight:700}
  .pill.new{background:#fef3c7;color:#92400e}
  .pill.contacted{background:#dbeafe;color:#1e40af}
  .pill.booked{background:#d1fae5;color:#065f46}
  .pill.cancelled{background:#fee2e2;color:#991b1b}
  .row-actions{display:flex;gap:6px}
  .icon-btn{background:var(--light);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--navy);text-decoration:none;display:inline-block}
  .icon-btn:hover{background:var(--gold)}
  .icon-btn.del:hover{background:#dc2626;color:#fff}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal h2{margin-bottom:18px;font-size:1.2rem}
  .modal .form{gap:12px;display:grid}
  .modal .field{display:flex;flex-direction:column;gap:6px}
  .modal .field label{font-size:.85rem;font-weight:700}
  .modal .field input,.modal .field textarea,.modal .field select{padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:.92rem}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1e3a5f)}
  .login{background:#fff;padding:40px;border-radius:20px;width:100%;max-width:400px;box-shadow:var(--shadow-lg)}
  .login h1{text-align:center;margin-bottom:8px;font-size:1.6rem}
  .login .sub{text-align:center;color:var(--gray);margin-bottom:26px;font-size:.9rem}
  .login .field{margin-bottom:14px}
  .hidden{display:none!important}
  @media(max-width:820px){.admin-wrap{grid-template-columns:1fr}.sidebar{position:relative;height:auto}}
</style>
</head>
<body>

<div id="loginView" class="login-bg">
  <form class="login" id="loginForm">
    <h1>لوحة تحكم مُساعد</h1>
    <p class="sub">الدخول للمدير فقط</p>
    <div class="field"><label>اسم المستخدم</label><input name="username" required autofocus style="width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" name="password" required style="width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit"></div>
    <button class="btn btn-gold btn-block" style="margin-top:14px" type="submit">دخول</button>
    <p id="loginErr" style="color:#dc2626;text-align:center;margin-top:12px;font-size:.9rem"></p>
  </form>
</div>

<div id="dashView" class="admin-wrap hidden">
  <aside class="sidebar">
    <a href="#" class="logo"><span class="mark">م</span><span style="color:#fff">مُساعد<small>Admin</small></span></a>
    <nav id="sideNav">
      <a href="#" data-view="dashboard" class="active">📊 الرئيسية</a>
      <a href="#" data-view="leads">📨 الطلبات</a>
      <a href="#" data-view="hotels">🏨 الفنادق</a>
      <a href="#" data-view="services">🛎️ الخدمات</a>
      <a href="#" data-view="tours">🗺️ الجولات</a>
      <a href="#" data-view="events">🎭 الفعاليات</a>
      <a href="#" data-view="restaurants">🍽️ المطاعم</a>
      <a href="#" data-view="universities">🎓 الجامعات</a>
      <a href="#" data-view="destinations">📍 الوجهات</a>
      <a href="#" data-view="settings">⚙️ الإعدادات</a>
      <a href="#" id="logoutBtn" style="margin-top:20px">🚪 تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="main">
    <div class="top"><h1 id="viewTitle">الرئيسية</h1><span>مرحباً، <strong id="adminName"></strong></span></div>
    <div id="viewContent"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
